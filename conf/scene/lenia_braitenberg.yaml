defaults:
  - base_scene
  - environment/components/entities/braitenberg@environment.components.agents
  - environment/components/entities/particle_lenia@environment.components.particles
  - clients/braitenberg@clients.client_list.agents
  - clients/particle_lenia@clients.client_list.particles

scene_name: lenia_braitenberg

environment:
  kwargs:
    box_size: 60.
    neighbor_radius: 10.
    num_scan_steps: 10
  components:
    agents:
      n_max: 8
      diameter:
        _all_values_: 1.0
      proxs_dist_max:
        _all_values_: 10.
      subtype_to_n:
        - [0, "${...n_max}"]
    particles:
      n_max: 400
      subtype_to_n:
        - [1, "${...n_max}"]

subtypes:
  - agent
  - particle

simulator:
  kwargs:
    freq: -1
