defaults:
  - base_scene
  - environment/components/entities/braitenberg@environment.components.agents
  - environment/components/entities/particle_lenia@environment.components.particles
  - client/braitenberg@client.agents
  - client/particle_lenia@client.particles

scene_name: lenia_braitenberg

environment:
  kwargs:
    box_size: 60.
    neighbor_radius: 10.
    num_scan_steps: 10
  components:
    agents:
      n_exists: 8
      diameter:
        _all_values_: 1.0
      proxs_dist_max:
        _all_values_: 10.
      subtype_to_n:
        - [0, 8]
    particles:
      n_exists: 400
      subtype_to_n:
        - [1, 400]

subtypes:
  - agent
  - particle

simulator:
  kwargs:
    freq: -1
