defaults:
  - base_scene
  - environment/components/base_physics@environment.components.component_list
  - environment/components/entities/braitenberg@environment.components.component_list.agents
  - environment/components/entities/particle_lenia@environment.components.component_list.particles
  - clients/braitenberg@environment.components.component_list.agents.client
  - clients/particle_lenia@environment.components.component_list.particles.client

scene_name: lenia_braitenberg

environment:
  kwargs:
    box_size: 60.
    neighbor_radius: 10.
    num_scan_steps: 10
  components:
    component_list:
      agents:
        n_max: 8
        diameter:
          _all_values_: 1.0
        proxs_dist_max:
          _all_values_: 10.
        subtype:
          _all_values_: agent
      particles:
        n_max: 400
        subtype:
          _all_values_: particle

subtype_labels:
  - agent
  - particle

simulator:
  freq: -1
