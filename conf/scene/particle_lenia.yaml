defaults:
  - base_scene
  - environment/components/reset/default@environment.components.component_list.reset
  - environment/components/friction/default@environment.components.component_list.friction
  - environment/components/step/default@environment.components.component_list.step
  - environment/components/entities/particle_lenia@environment.components.component_list.particles
  - clients/particle_lenia@environment.components.component_list.particles.client
  - _self_

scene_name: particle_lenia

environment:
  _target_: vivarium.environment.Environment
  kwargs:
    num_scan_steps: 10
  components:
    component_list:
      particles:
        n_max: 600
        subtype:
          _all_values_: particle
        diameter:
          _all_values_: 0.4
        friction:
          _all_values_: 0.7

subtype_labels:
  - particle

simulator:
  client:
    controller_kwargs:
      freq: -1.
