defaults:
  - environment/kwargs/default@environment.kwargs
  - environment/components/reset/default@environment.components.reset
  - environment/components/friction/default@environment.components.friction
  - environment/components/step/default@environment.components.step
  - environment/components/entities/particle_lenia@environment.components.particles
  - client/particle_lenia@client.particles
  
scene_name: particle_lenia

environment:
  cls: vivarium.environments.Environment
  kwargs:
    num_scan_steps: 10
  components:
    particles:
      n_exists: 400
      subtype_to_n:
        - [0, 400]
      diameter:
        _all_values_: 0.4
      friction:
        _all_values_: 0.7

subtypes:
  - particle

simulator:
  kwargs:
    freq: -1
