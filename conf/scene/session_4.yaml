defaults:
  - session_defaults
  - environment/components/spawn/default@environment.components.component_list.spawn
  - environment/components/consumption/default@environment.components.component_list.consumption
  - clients/spawn@environment.components.component_list.spawn.client
  - clients/consumption@environment.components.component_list.consumption.client

scene_name: session_4

environment:
  components:
    component_list:
      agents:
        n_max: 3
      objects:
        n_max: 29
        by_indices:
          - resource:
              indices: "${range: 0, 15}"
              n_exists: 3
              subtype: resource
              diameter: 3.0
              client:
                color: green
          - small_obstacle:
              indices: "${range: 15, 22}"
              subtype: small_obstacle
              diameter: 5.0
          - big_obstacle:
              indices: "${range: 22, 29}"
              subtype: big_obstacle
              diameter: 7.0
              client:
                color: red
      spawn:
        subtype: 1
        period: 400
        start: false
        position_range: [0., 100., 0., 100.]
        orientation_range: [0., 6.3]
      consumption:
        source_subtype: 0
        target_subtype: 1
        range: 12.5
        start: false

subtype_labels:
  - agent
  - resource
  - small_obstacle
  - big_obstacle
