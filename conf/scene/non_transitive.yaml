defaults:
  - base_scene
  - environment/components/base_physics@environment.components.component_list
  - environment/components/entities/braitenberg@environment.components.component_list.agents
  - clients/braitenberg@environment.components.component_list.agents.client
  - environment/components/consumption/default@environment.components.component_list.a2b
  - clients/consumption@environment.components.component_list.a2b.client
  - environment/components/consumption/default@environment.components.component_list.b2c
  - clients/consumption@environment.components.component_list.b2c.client
  - environment/components/consumption/default@environment.components.component_list.c2a
  - clients/consumption@environment.components.component_list.c2a.client
  - environment/components/energy/default@environment.components.component_list.energy
  - environment/components/reproduction/default@environment.components.component_list.reproduction

scene_name: eco_evo

environment:
  kwargs:
    box_size: 100.0
    neighbor_radius: 10.0
    dr_threshold: 1.0  # A scalar specifying the maximum distance particles can move before rebuilding the neighbor list.
    num_scan_steps: 1
  components:
    component_list:
      step:
        dt: 0.2
      agents:
        n_max: 300
        n_behaviors: 2
        diameter:
          _all_values_: 2.0
        wheel_diameter:
          _all_values_: 2.0
        proxs_cos_min:
          _all_values_: 0.
        proxs_dist_max:
          _all_values_: 10.0           
        client:
          controller_kwargs:
            visible_wheels: 
              _all_values_: false
            visible_proxs: 
              _all_values_: false
        by_indices:
          - A:
              indices: "${range: 0, 100}"
              n_exists: 80
              subtype: A           
              client:
                color: red
                behaviors:
                  - AGGRESSION: [B]
                  - SHY: [A,C]
          - B:
              indices: "${range: 100, 200}"
              n_exists: 80
              subtype: B
              client:
                color: green
                behaviors:
                  - AGGRESSION: [C]
                  - SHY: [A,B]
          - C:
              indices: "${range: 200, 300}"
              n_exists: 80
              subtype: C
              client:
                color: blue
                behaviors:
                  - AGGRESSION: [A]
                  - SHY: [B,C]                  
      a2b:
        source_subtype: 0
        target_subtype: 1
        range: 3.0
        start: true
      b2c:
        source_subtype: 1
        target_subtype: 2
        range: 3.0
        start: true
      c2a:
        source_subtype: 2
        target_subtype: 0
        range: 3.0
        start: true
      energy:
        entity_type: agents
        subtype: -1
        energy_init: 1.
        energy_max: 100000.0
        energy_decay: 0.0
        energy_burst: 0.01
      reproduction:
        entity_type: agents
        birth_energy_threshold: 2.0
        birth_energy: 1.
        birth_radius: 10.
        birth_recovery_time: 100

simulator:
  client:
    controller_kwargs:
      freq: -1

subtype_labels:
  - A
  - B
  - C
