defaults:
  - braitenberg_defaults

scene_name: quickstart

environment:
  kwargs:
    box_size: 100
    neighbor_radius: 150
    num_scan_steps: 1
    to_jit: true
  components:
    component_list:
      agents:
        n_max: 3
        n_behaviors: 1
        subtype:
          _all_values_: agent
        diameter:
          _all_values_: 5.0
        proxs_dist_max:
          _all_values_: 30.0
        client:
          controller_kwargs:
            color:
              _all_values_: blue
            behaviors:
              _all_values_:
                - MANUAL: []
      objects:
        n_max: 12
        by_indices:
          - small_objects:
              indices: "${range: 0, 8}"
              subtype: small_object
              diameter: 3.0
              client:
                color: orange
          - big_objects:
              indices: "${range: 8, 12}"
              subtype: big_object
              diameter: 10.0
              client:
                color: red


simulator:
  freq: 20.0

subtype_labels:
  - agent
  - small_object
  - big_object
