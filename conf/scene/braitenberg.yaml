environment:
  cls: vivarium.environments.Environment
  kwargs:
    box_size: 100.0
    neighbor_radius: 300.0
    num_scan_steps: 100
    to_jit: True

simulator:
  cls: vivarium.simulator.Simulator
  kwargs:
    freq: 40

subtypes:
  - prey
  - predator
  - resource

state:
  cls: vivarium.environments.state.BaseState
  kwargs:
    dt: 0.1
    collision_alpha: 2.0
    collision_eps: 1.0

entities:
  entity_state:
    cls: vivarium.environments.state.EntityState
  entity_types:
    - agents
    - objects

  agents:
    cls: vivarium.environments.braitenberg.selective_sensing.state.AgentState
    simulator_controller_cls: vivarium.controllers.simulator_controller.ControllerAgent
    kwargs:
      n_exists: 24
      mass:
        _all_values_: 1.0
      position: random
      orientation: random
      diameter:
        _all_values_: 6.0
      friction:
        _all_values_: 1.0
      n_behaviors: 4
      subtype_to_n:
        - [0, 12]
        - [1, 12]
      wheel_diameter:
        _all_values_: 3.0
      proxs_dist_max:
        _all_values_: 20.0
      proxs_cos_min:
        _all_values_: 0.0

  objects:
    cls: vivarium.environments.objects.state.ObjectState
    simulator_controller_cls: vivarium.controllers.simulator_controller.ControllerObject
    kwargs:
      n_exists: 10
      mass:
        _all_values_: 1.0
      position: random
      orientation:
        _all_values_: 0.0
      diameter:
        _all_values_: 3.0
      friction:
        _all_values_: 1.0
      subtype_to_n:
        - [10, 3]

client:
  agents:
    kwargs:
      color:
        _all_values_: red
      visible:
        _all_values_: true
      visible_wheels:
        _all_values_: true
      visible_proxs:
        _all_values_: true
    simulator_controller:
      cls: vivarium.controllers.simulator_controller.ControllerAgent
      kwargs: {}  #TODO: kwargs now defined a level upper, could be all removed at this level? (also in objects)
    notebook_controller:
      cls: vivarium.controllers.notebook_controller.Agent
      kwargs: {}
    param:
      cls: vivarium.controllers.panel_controller.Agent
      kwargs: {}
    panel_controller:
      cls: vivarium.controllers.panel_controller.PanelControllerAgent
      kwargs: {}
    panel_interface:
      cls: vivarium.interface.panel_app.AgentManager
      kwargs: {}
  objects:
    kwargs:
      color:
        _all_values_: blue
      visible:
        _all_values_: true
    simulator_controller:
      cls: vivarium.controllers.simulator_controller.ControllerObject
      kwargs: {}
    notebook_controller:
      cls: vivarium.controllers.notebook_controller.Object
      kwargs: {}
    param:
      cls: vivarium.controllers.panel_controller.Object
      kwargs: {}
    panel_controller:
      cls: vivarium.controllers.panel_controller.PanelControllerObject
      kwargs: {}
    panel_interface:
      cls: vivarium.interface.panel_app.ObjectManager
      kwargs: {}
