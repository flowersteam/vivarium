defaults:
  - braitenberg_defaults
  - _self_

scene_name: braitenberg

environment:
  components:
    component_list:
      agents:
        n_max: 10
        by_indices:
          - prey:
              indices: "${range: 0, 5}"
              subtype: prey
              diameter: 6.0
              client:
                color: purple
          - predator:
              indices: "${range: 5, 10}"
              subtype: predator
              diameter: 10.0
      objects:
        subtype:
          _all_values_: resource

subtype_labels:
  - prey
  - predator
  - resource
