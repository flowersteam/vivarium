name: Build and Release

on:
  # Trigger on version tags
  push:
    tags:
      - 'v*'
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release'
        required: false
        default: false
        type: boolean
      version:
        description: 'Version name (for manual builds)'
        required: false
        default: 'dev'
        type: string

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            python: '3.12'
            artifact_name: vivarium-linux-x64

          # Linux ARM64
          - os: ubuntu-24.04-arm
            python: '3.12'
            artifact_name: vivarium-linux-arm64

          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            python: '3.12'
            artifact_name: vivarium-macos-arm64

          # macOS Intel (x86_64)
          - os: macos-15-intel
            python: '3.11'
            artifact_name: vivarium-macos-x64

          # Windows x64
          - os: windows-latest
            python: '3.12'
            artifact_name: vivarium-windows-x64


    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: setup.py

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Patch jax-md for Intel Mac
        if: matrix.os == 'macos-15-intel'
        run: python scripts/patch_jax_md.py

      - name: Build with PyInstaller
        run: pyinstaller vivarium_multi.spec --noconfirm

      - name: Sign macOS binaries (ad-hoc)
        if: runner.os == 'macOS'
        run: |
          # Ad-hoc sign all executables in the vivarium folder
          find dist/vivarium -type f -perm +111 -exec codesign --force --deep --sign - {} \; 2>/dev/null || true

      - name: Create inner archive and package (Unix)
        if: runner.os != 'Windows'
        run: |
          # Create inner archive with executables and _internal
          cd dist/vivarium
          tar -czvf ../vivarium-build.tar.gz *
          cd ..

          # Create outer package folder
          mkdir -p vivarium-package
          mv vivarium-build.tar.gz vivarium-package/

      - name: Create launcher script (macOS)
        if: runner.os == 'macOS'
        run: |
          cat > dist/vivarium-package/Start-Vivarium.command << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"

          if [ -f "vivarium-build.tar.gz" ]; then
              echo "First launch - setting up Vivarium..."
              xattr -cr vivarium-build.tar.gz 2>/dev/null || true
              tar -xzf vivarium-build.tar.gz
              rm vivarium-build.tar.gz
              echo "Setup complete!"
              echo ""
          fi

          echo "Starting Vivarium..."
          echo "Close this terminal window to quit."
          echo ""
          ./vivarium-interface
          EOF
          chmod +x dist/vivarium-package/Start-Vivarium.command

      - name: Create launcher script (Linux)
        if: runner.os == 'Linux'
        run: |
          cat > dist/vivarium-package/start-vivarium.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"

          if [ -f "vivarium-build.tar.gz" ]; then
              echo "First launch - setting up Vivarium..."
              tar -xzf vivarium-build.tar.gz
              rm vivarium-build.tar.gz
              echo "Setup complete!"
              echo ""
          fi

          echo "Starting Vivarium..."
          echo "Close this terminal window to quit."
          echo ""
          ./vivarium-interface
          EOF
          chmod +x dist/vivarium-package/start-vivarium.sh

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz -C vivarium-package .

      - name: Create inner archive and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist\vivarium
          Compress-Archive -Path * -DestinationPath ..\vivarium-build.zip
          cd ..
          New-Item -ItemType Directory -Path vivarium-package
          Move-Item vivarium-build.zip vivarium-package\

      - name: Create launcher script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = @"
          @echo off
          cd /d "%~dp0"

          if exist "vivarium-build.zip" (
              echo First launch - setting up Vivarium...
              powershell -Command "Expand-Archive -Path vivarium-build.zip -DestinationPath ."
              del vivarium-build.zip
              echo Setup complete!
              echo.
          )

          echo Starting Vivarium...
          echo Close this window to quit.
          echo.
          vivarium-interface.exe
          "@
          # Remove leading whitespace from each line
          $script -split "`n" | ForEach-Object { $_.TrimStart() } | Set-Content -Path dist\vivarium-package\Start-Vivarium.bat -Encoding ASCII

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path vivarium-package\* -DestinationPath ../${{ matrix.artifact_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0  # Already compressed, avoid double compression

      - name: Extract outer archive for smoke tests (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p smoke-test
          tar -xzf ${{ matrix.artifact_name }}.tar.gz -C smoke-test
          ls -la smoke-test

      - name: Extract outer archive for smoke tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path smoke-test
          Expand-Archive -Path ${{ matrix.artifact_name }}.zip -DestinationPath smoke-test
          Get-ChildItem smoke-test

      - name: Smoke test - Launcher extracts and Interface starts
        run: |
          # Run the launcher script which extracts the inner archive and starts interface
          cd smoke-test
          if [ "$RUNNER_OS" == "macOS" ]; then
            bash Start-Vivarium.command &
          elif [ "$RUNNER_OS" == "Linux" ]; then
            bash start-vivarium.sh &
          else
            cmd.exe /c Start-Vivarium.bat &
          fi
          INTERFACE_PID=$!
          sleep 20
          # Check if interface is responding to HTTP
          python -c "
          from vivarium.utils.handle_server_interface import wait_for_http
          import sys
          if wait_for_http('http://localhost:5006/run_interface', retries=6, delay=5, timeout=10):
              print('[OK] Interface health check passed')
              sys.exit(0)
          else:
              print('[FAIL] Interface health check failed')
              sys.exit(1)
          "
          kill $INTERFACE_PID 2>/dev/null || true
        shell: bash

      - name: Smoke test - Server starts
        run: |
          # Inner archive already extracted by launcher, test server directly
          cd smoke-test
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./vivarium-server.exe &
          else
            ./vivarium-server &
          fi
          SERVER_PID=$!
          sleep 60
          # Check if server is responding (using grpc health check)
          python -c "
          from vivarium.utils.handle_server_interface import check_server_running
          import sys
          if check_server_running():
              print('[OK] Server health check passed')
              sys.exit(0)
          else:
              print('[FAIL] Server health check failed')
              sys.exit(1)
          "
          kill $SERVER_PID 2>/dev/null || true
        shell: bash

      - name: Smoke test - Jupyter starts
        run: |
          # Inner archive already extracted by launcher, test jupyter directly
          cd smoke-test
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./vivarium-jupyter.exe --port 8889 &
          else
            ./vivarium-jupyter --port 8889 &
          fi
          JUPYTER_PID=$!
          sleep 15
          # Check if Jupyter is responding
          python -c "
          from vivarium.utils.handle_server_interface import check_jupyter_running
          import sys
          if check_jupyter_running(8889):
              print('[OK] Jupyter health check passed')
              sys.exit(0)
          else:
              print('[FAIL] Jupyter health check failed')
              sys.exit(1)
          "
          kill $JUPYTER_PID 2>/dev/null || true
        shell: bash

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # Only create release on tag push or manual trigger with create_release=true
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version || 'dev' }}" >> $GITHUB_OUTPUT
          fi

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Vivarium ${{ steps.version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
