name: Build and Release

on:
  # Trigger on version tags
  push:
    tags:
      - 'v*'
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release'
        required: false
        default: false
        type: boolean
      version:
        description: 'Version name (for manual builds)'
        required: false
        default: 'dev'
        type: string

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            python: '3.12'
            artifact_name: vivarium-linux-x64

          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            python: '3.12'
            artifact_name: vivarium-macos-arm64

          # macOS Intel (x86_64)
          - os: macos-13
            python: '3.11'
            artifact_name: vivarium-macos-x64

          # Windows
          - os: windows-latest
            python: '3.12'
            artifact_name: vivarium-windows-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: setup.py

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Patch jax-md for Intel Mac
        if: matrix.os == 'macos-13'
        run: python scripts/patch_jax_md.py

      - name: Build with PyInstaller
        run: pyinstaller vivarium_multi.spec --noconfirm

      - name: Sign macOS binaries (ad-hoc)
        if: runner.os == 'macOS'
        run: |
          # Ad-hoc sign all executables
          find dist -type f -perm +111 -exec codesign --force --deep --sign - {} \; 2>/dev/null || true

      - name: Create launcher script (macOS)
        if: runner.os == 'macOS'
        run: |
          cat > dist/Start-Vivarium.command << 'EOF'
          #!/bin/bash
          # Vivarium Launcher - double-click to start
          # Close this terminal window to quit Vivarium

          cd "$(dirname "$0")"
          echo "Starting Vivarium..."
          echo "Close this terminal window to quit."
          echo ""
          ./vivarium-interface/vivarium-interface
          EOF
          chmod +x dist/Start-Vivarium.command

      - name: Create launcher script (Linux)
        if: runner.os == 'Linux'
        run: |
          cat > dist/start-vivarium.sh << 'EOF'
          #!/bin/bash
          # Vivarium Launcher
          # Close this terminal window to quit Vivarium

          cd "$(dirname "$0")"
          echo "Starting Vivarium..."
          echo "Close this terminal window to quit."
          echo ""
          ./vivarium-interface/vivarium-interface
          EOF
          chmod +x dist/start-vivarium.sh

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz vivarium-server vivarium-interface Start-Vivarium.command start-vivarium.sh 2>/dev/null || \
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz vivarium-server vivarium-interface Start-Vivarium.command 2>/dev/null || \
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz vivarium-server vivarium-interface start-vivarium.sh

      - name: Create launcher script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @"
          @echo off
          REM Vivarium Launcher - double-click to start
          REM Close this window to quit Vivarium

          cd /d "%~dp0"
          echo Starting Vivarium...
          echo Close this window to quit.
          echo.
          vivarium-interface\vivarium-interface.exe
          "@ | Out-File -FilePath dist\Start-Vivarium.bat -Encoding ASCII

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path vivarium-server, vivarium-interface, Start-Vivarium.bat -DestinationPath ../${{ matrix.artifact_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # Only create release on tag push or manual trigger with create_release=true
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version || 'dev' }}" >> $GITHUB_OUTPUT
          fi

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Vivarium ${{ steps.version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
