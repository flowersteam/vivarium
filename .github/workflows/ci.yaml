name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:  # Manual trigger from any branch

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full Python version coverage on Ubuntu
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          # macOS Apple Silicon
          - os: macos-latest
            python: '3.12'
          # macOS Intel
          - os: macos-13
            python: '3.12'
          # Windows
          - os: windows-latest
            python: '3.12'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest-timeout

      - name: Run pytest
        run: pytest -v --timeout=120

  script-smoke-test:
    name: Script Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Test run_server.py startup
        run: |
          python scripts/run_server.py &
          SERVER_PID=$!
          sleep 15
          python -c "from vivarium.utils.handle_server_interface import check_server_running; assert check_server_running(), 'Server not responding'"
          kill $SERVER_PID || true

      - name: Test run_interface.py with Panel
        run: |
          # Start server first (required by interface)
          python scripts/run_server.py &
          SERVER_PID=$!
          sleep 15
          # Start Panel interface
          panel serve scripts/run_interface.py --show=False &
          PANEL_PID=$!
          sleep 10
          # Check Panel is responding (HTTP 200)
          curl -sf http://localhost:5006/run_interface -o /dev/null && echo "Panel interface OK"
          kill $PANEL_PID $SERVER_PID || true

      - name: Test run_vivarium.py startup
        run: |
          # run_vivarium.py starts both server+interface and opens browser
          # Run with timeout and verify both services start
          timeout 30 python scripts/run_vivarium.py || true
          # Give processes time to start
          sleep 5
          # Verify server is running
          python -c "from vivarium.utils.handle_server_interface import check_server_running; assert check_server_running(), 'Server not running'"
          # Verify interface is responding
          curl -sf http://localhost:5006/run_interface -o /dev/null && echo "Interface OK"
          # Cleanup
          python -c "from vivarium.utils.handle_server_interface import kill_all_vivarium_processes; kill_all_vivarium_processes()"
