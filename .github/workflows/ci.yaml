name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ubuntu
          - macos
          - windows

jobs:
  test-ubuntu:
    name: Tests (ubuntu-latest, Python ${{ matrix.python }})
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.os == 'all' || github.event.inputs.os == 'ubuntu'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest-timeout

      - name: Run pytest
        run: pytest -v --timeout=120

  test-macos:
    name: Tests (${{ matrix.os }}, Python 3.12)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.os == 'all' || github.event.inputs.os == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-latest
          # macOS Intel
          - os: macos-13

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest-timeout

      - name: Run pytest
        run: pytest -v --timeout=120

  test-windows:
    name: Tests (windows-latest, Python 3.12)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.os == 'all' || github.event.inputs.os == 'windows'

    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest-timeout

      - name: Run pytest
        run: pytest -v --timeout=120

  script-smoke-test:
    name: Script Smoke Tests
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.os == 'all' || github.event.inputs.os == 'ubuntu'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Test run_server.py startup
        run: |
          python scripts/run_server.py &
          SERVER_PID=$!
          sleep 15
          python -c "from vivarium.utils.handle_server_interface import check_server_running; assert check_server_running(), 'Server not responding'"
          kill $SERVER_PID || true

      - name: Test run_interface.py with Panel
        run: |
          # Start server first (required by interface)
          python scripts/run_server.py &
          SERVER_PID=$!
          sleep 15
          # Start Panel interface
          panel serve scripts/run_interface.py --show=False &
          PANEL_PID=$!
          sleep 10
          # Check Panel is responding (HTTP 200)
          curl -sf http://localhost:5006/run_interface -o /dev/null && echo "Panel interface OK"
          kill $PANEL_PID $SERVER_PID || true

      - name: Test run_vivarium.py startup
        run: |
          # run_vivarium.py starts both server+interface and opens browser
          # Run with timeout and verify both services start
          timeout 30 python scripts/run_vivarium.py || true
          # Give processes time to start
          sleep 5
          # Verify server is running
          python -c "from vivarium.utils.handle_server_interface import check_server_running; assert check_server_running(), 'Server not running'"
          # Verify interface is responding
          curl -sf http://localhost:5006/run_interface -o /dev/null && echo "Interface OK"
          # Cleanup
          python -c "from vivarium.utils.handle_server_interface import kill_all_vivarium_processes; kill_all_vivarium_processes()"
