name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ubuntu
          - macos
          - windows

jobs:
  test-ubuntu:
    name: Tests (ubuntu-latest, Python ${{ matrix.python }})
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.os == 'all' || github.event.inputs.os == 'ubuntu'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: setup.py

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest-timeout

      - name: Run pytest
        run: pytest -v --timeout=120

  test-macos:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.os == 'all' || github.event.inputs.os == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-latest
            python: '3.12'
          # macOS Intel - use Python 3.11 (grpcio has no 3.12 wheel for x86_64)
          - os: macos-15-intel
            python: '3.11'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: setup.py

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest-timeout

      - name: Patch jax-md for Intel Mac
        if: matrix.os == 'macos-15-intel'
        run: python scripts/patch_jax_md.py

      - name: Run pytest
        run: pytest -v --timeout=120

  test-windows:
    name: Tests (windows-latest, Python 3.12)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.os == 'all' || github.event.inputs.os == 'windows'

    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: setup.py

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest-timeout

      - name: Run pytest
        run: pytest -v --timeout=120

  script-smoke-test:
    name: Smoke Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
            shell: bash
          - os: macos-latest
            python: '3.12'
            shell: bash
          - os: macos-15-intel
            python: '3.11'
            shell: bash
          - os: windows-latest
            python: '3.12'
            shell: pwsh

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: setup.py

      - name: Install dependencies
        run: pip install -e .

      - name: Patch jax-md for Intel Mac
        if: matrix.os == 'macos-15-intel'
        run: python scripts/patch_jax_md.py

      # Unix smoke tests (Linux + macOS)
      - name: Test run_server.py startup (Unix)
        if: runner.os != 'Windows'
        run: |
          python scripts/run_server.py &
          SERVER_PID=$!
          sleep 15
          python -c "from vivarium.utils.handle_server_interface import check_server_running; assert check_server_running(), 'Server not responding'"
          kill $SERVER_PID || true

      - name: Test run_interface.py with Panel (Unix)
        if: runner.os != 'Windows'
        run: |
          python scripts/run_server.py &
          SERVER_PID=$!
          sleep 15
          panel serve scripts/run_interface.py --show=False &
          PANEL_PID=$!
          sleep 10
          curl -sf http://localhost:5006/run_interface -o /dev/null && echo "Panel interface OK"
          kill $PANEL_PID $SERVER_PID || true

      - name: Test run_vivarium.py startup (Unix)
        if: runner.os != 'Windows'
        run: |
          python scripts/run_vivarium.py --no-browser &
          VIVARIUM_PID=$!
          sleep 45
          python -c "from vivarium.utils.handle_server_interface import check_server_running; assert check_server_running(), 'Server not running'"
          curl -sf http://localhost:5006/run_interface -o /dev/null && echo "Interface OK"
          kill $VIVARIUM_PID || true
          python -c "from vivarium.utils.handle_server_interface import kill_all_vivarium_processes; kill_all_vivarium_processes()"

      # Windows smoke tests (PowerShell) - using Start-Process for proper background execution
      - name: Test run_server.py startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serverProc = Start-Process -FilePath python -ArgumentList "scripts/run_server.py" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 20
          python -c "from vivarium.utils.handle_server_interface import check_server_running; assert check_server_running(), 'Server not responding'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Server OK"
          Stop-Process -Id $serverProc.Id -Force -ErrorAction SilentlyContinue

      - name: Test run_interface.py with Panel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serverProc = Start-Process -FilePath python -ArgumentList "scripts/run_server.py" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 20
          # Start Panel with output redirected to files for debugging
          $panelProc = Start-Process -FilePath python -ArgumentList "-m", "panel", "serve", "scripts/run_interface.py", "--show=False" -PassThru -NoNewWindow -RedirectStandardOutput "panel_stdout.log" -RedirectStandardError "panel_stderr.log"
          Start-Sleep -Seconds 5
          Write-Host "Panel process started with PID: $($panelProc.Id)"
          # Check if process is still running
          if ($panelProc.HasExited) {
            Write-Host "Panel process exited early with code: $($panelProc.ExitCode)"
            Write-Host "=== Panel stdout ==="
            if (Test-Path "panel_stdout.log") { Get-Content "panel_stdout.log" }
            Write-Host "=== Panel stderr ==="
            if (Test-Path "panel_stderr.log") { Get-Content "panel_stderr.log" }
            exit 1
          }
          python -c "from vivarium.utils.handle_server_interface import wait_for_http; assert wait_for_http('http://localhost:5006/run_interface', retries=12, delay=5), 'Panel interface not responding'"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== Panel stdout ==="
            if (Test-Path "panel_stdout.log") { Get-Content "panel_stdout.log" }
            Write-Host "=== Panel stderr ==="
            if (Test-Path "panel_stderr.log") { Get-Content "panel_stderr.log" }
            exit $LASTEXITCODE
          }
          Write-Host "Panel interface OK"
          Stop-Process -Id $panelProc.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $serverProc.Id -Force -ErrorAction SilentlyContinue

      - name: Test run_vivarium.py startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vivariumProc = Start-Process -FilePath python -ArgumentList "scripts/run_vivarium.py", "--no-browser" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 50
          python -c "from vivarium.utils.handle_server_interface import check_server_running; assert check_server_running(), 'Server not running'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from vivarium.utils.handle_server_interface import wait_for_http; assert wait_for_http('http://localhost:5006/run_interface', retries=12, delay=5), 'Interface not responding'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Interface OK"
          Stop-Process -Id $vivariumProc.Id -Force -ErrorAction SilentlyContinue
          python -c "from vivarium.utils.handle_server_interface import kill_all_vivarium_processes; kill_all_vivarium_processes()"
