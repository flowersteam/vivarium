syntax = "proto3";

option java_multiple_files = true;
option java_package = "io.grpc.examples.simulator";
option java_outer_classname = "SimulatorProto";
option objc_class_prefix = "SIM";

import "google/protobuf/empty.proto";
package simulator;

// Interface exported by the server.
service SimulatorServer {
  // Do a step in the simulation
  rpc Step(google.protobuf.Empty) returns (Dataclass) {}
  rpc SetChangesAndStep(StateChangeList) returns (Dataclass) {}
  
  // Get state of the simulation
  rpc GetState(google.protobuf.Empty) returns (Dataclass) {}
  
  rpc GetControllerParameters(google.protobuf.Empty) returns (Dataclass) {}

  rpc GetStateAndControllerParameters(google.protobuf.Empty) returns (Dataclass) {}

  // send changes made on the client side to the simulator server (returns updated state)
  rpc SetChangesReturnsState(StateChangeList) returns (Dataclass) {}
  
  // send changes without returning state (for use with streaming)
  rpc SetChanges(StateChangeList) returns (google.protobuf.Empty) {}

  // send the labels of subtypes and scene name
  rpc GetSceneName(Scene) returns (Scene) {}

  rpc RegisterClient(Client) returns (google.protobuf.Empty) {}
  rpc UnregisterClient(Client) returns (google.protobuf.Empty) {}

  // Handle the connection between the server and the clients
  rpc IsRunning(google.protobuf.Empty) returns (IsRunningState) {}
  rpc Start(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc Stop(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // ============ Streaming RPCs ============
  
  // Server-side streaming: Subscribe to state updates when server is running
  // Server pushes state whenever it changes (after each step)
  rpc StreamState(StreamConfig) returns (stream Dataclass) {}
  
  // Bidirectional streaming: Send commands, receive state updates
  // Client sends changes, server responds with updated state after each step
  rpc BidirectionalStep(stream StateChangeList) returns (stream Dataclass) {}
}

// Configuration for streaming RPCs
message StreamConfig {
  // Maximum updates per second (0 = unlimited)
  int32 max_fps = 1;
  // Whether to include controller parameters in updates
  bool include_controller_params = 2;
}

message Dataclass {
  Value value = 1;  // For numpy arrays
  map<string, Dataclass> nested_fields = 2;  // For nested dataclasses
}

message SliceArg {
  oneof slice_arg {
    int32 int_arg = 1;
    bool is_none = 2;
  }
}

message Slice {
  optional SliceArg start = 1;
  optional SliceArg stop = 2;
  optional SliceArg step = 3;
}

message IndexList {
  repeated Idx index_list = 1;
}

message Idx {
  oneof idx {
    int32 int_idx = 1;
    Slice slice_idx = 2;
    IndexList index_list = 3;
    bool is_none = 4;
  }
}

message Value {
  oneof value {
    NDArray ndarray = 1;
    bool bool_value = 3;
    int32 int_value = 4;
    float float_value = 5;
    string str_value = 6;
    ListFloat list_float_value = 7;
    ListString list_string_value = 8;
    ListBool list_bool_value = 9;
    ListBehaviors list_behaviors_value = 10;
  }
}

message ListFloat {
  repeated float list = 1;
}

message ListString {
  repeated string list = 1;
}

message ListBool {
  repeated bool list = 1;
}

message Behavior {
  map<string, ListString> behavior_to_sensed = 1;
}

message Behaviors {
  repeated Behavior behaviors = 1;
}

message ListBehaviors {
  repeated Behaviors list = 1;
}

message Change {
  Idx idx = 1;
  Value value = 2;
}

message Changes {
  repeated Change changes = 1;
}

message StateChange {
  Changes changes = 1;
  map<string, StateChange> child = 2;
}

message StateChangeList {
  repeated StateChange state_changes = 1;
}

message NDArray {
  bytes ndarray = 1;
}

message IsRunningState {
  bool is_running = 1;
}

message Scene {
  string scene_name = 1;
}

message Client {
  string name = 1;
}
